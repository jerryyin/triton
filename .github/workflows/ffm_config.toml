############### ITRACE OPTIONS ###############
[ffm_enable_itrace]
    # Enables itrace from command line
    gclog.ProcessCommand = "class:.*.itrace,debug-3"

[ffm_itrace_filter]
    # filters itrace to only output some instructions. Not compatible with ffm_enable_jit
    # multiple filters can be used, separated with :, can use wildcards
    # filter with - at start excludes an instruction
    # Works like gtest filters - first processes insts to include. If inst matches, then see if this is negated by matching an excluded filter
    dona.component.jitcu_itrace.instruction_filter="s_*:global_load*:-s_mov*"
    ffm_enable_itrace = true
    #Examples of filters:
    #   Only include v_convolve* ops
    #       dona.component.jitcu_itrace.instruction_filter="v_convolve*"
    #   Include everything except v_convolve* ops
    #       dona.component.jitcu_itrace.instruction_filter="-v_convolve*"
    #   Include all v_* ops and all s_* ops except s_mov_b32
    #       dona.component.jitcu_itrace.instruction_filter="v_*:s_*:-s_mov_b32"

[ffm_itrace_all_lanes]
    # Forces itrace to dump all active lanes (not just first/last)
    dona.component.jitcu_itrace.all_lanes=true
    ffm_enable_itrace = true

[ffm_itrace_vmem_all_threads]
    # Forces itrace to dump all threads for VMEM instructions
    dona.component.jitcu_itrace.vmem_all_threads=true
    ffm_enable_itrace = true

[ffm_itrace_disable_wave_start]
    # Suppress wave-start lines in itrace output
    dona.component.jitcu_itrace.disable_wave_start=true
    ffm_enable_itrace = true

[ffm_itrace_dump_matrix]
    # dump WMMA matrix data to itrace
    # itrace must be enabled, good alternative to ffm_itrace_all_lanes for debugging
    dona.component.jitcu_itrace.dump_matrix=true
    ffm_enable_itrace = true

[ffm_itrace_dump_rsrc_desc]
    # dump decoded rsrc descriptors (where supported)
    # itrace must be enabled
    dona.component.jitcu_itrace.dump_rsrc_desc=true
    ffm_enable_itrace = true

[ffm_itrace_vmem_only]
    # limits itrace dumps to only VMEM instructions
    # itrace must be enabled
    dona.component.jitcu_itrace.vmem_only=true
    ffm_enable_itrace = true

[ffm_itrace_wave_id_filter]
    # only dump itrace for this wave, set to specified debug ID, in hex
    dona.component.jitcu_itrace.wave_id=0x0
    ffm_enable_itrace = true

[ffm_enable_gvlog]
    # Enables GVLog dump file serialization. Each executed test case generates an individual gvlog file.
    dona.component.jitcu_itrace.enable_gvlog=true
    ffm_enable_itrace = true

############### GFXPIPE OPTIONS ###############
[ffm_gfxpipe_dump_depth]
    # Dump depth buffer contents after each draw
    dona.component.gfxpipe.dump_depth=true

[ffm_gfxpipe_dump_color]
    # Dump color buffer contents after each draw
    dona.component.gfxpipe.dump_color=true

[ffm_gfxpipe_enable_serializer]
    # Serialize gfxpipe execution for deterministic output
    dona.component.gfxpipe.enable_serializer=true

[ffm_gfxpipe_use_passthrough_prim_binning]
    # Bypass primitive binning — useful for debugging primitive setup
    dona.component.gfxpipe.use_passthrough_prim_binning=true

[ffm_enable_aql_trace]
    # Enables AQL Trace from command line
    gclog.ProcessCommand = "class:shader_ffm.hsakmtmodel,debug-3"

[ffm_local_gclog_cfg]
    # Use gclog.cfg in current dir
    gclog.ProcessFile = "gclog.cfg"

[ffm_gclog_flush]
    # Enable gclog (i.e. itrace) fflush after every line. Slow, but will ensure all dumped on crash or when stepping through code
    gclog.fflush = true

############### PLUGIN OPTIONS ###############

[ffm_plugins_dispatch_all_operand_lanes]
    # When set, ON_RESOURCE_ACCESS events are dispatched for all active lanes for operand (VGPR/SGPR/MREG) accesses.
    # By default only the first and last active lanes are dispatched to reduce event volume.
    dona.component.jitcu_plugins.all_operand_lanes=true

############### WAVE EXECUTION ORDER ###############
# waves run round-robin, serially within a workgroup in-order of wave ID by default.
# Options below change this to not round robin, to try and let some waves get ahead
# This is useful to debug sync issues in kernels

[ffm_exec_order_random]
    # Execute waves in random order
    ######## Use with ffm_debug_sync_signals for max effect ########
    dona.component.shader_complex.exec_order=2
    # Uncomment out the line below to use a specific random seed
    #dona.component.shader_complex.random_seed=962665528

[ffm_exec_order_ascending]
    # Execute waves in ascending order
    dona.component.shader_complex.exec_order=3

[ffm_exec_order_descending]
    # Execute waves in descending order
    dona.component.shader_complex.exec_order=1

############### OTHER KERNEL DEBUG OPTIONS ###############

[ffm_debug_sync_signals]
    # FFM runs waves serially within a workgroup which causes waves to FFM-yield after signaling on a barrier or semaphore
    # this allows other waves receiving the signal to run, simulating concurrently running waves
    # useful for synchronisation app debugs
    ######## Use with ffm_exec_order_random for max effect ########
    dona.component.shader_complex.debug_barier_semaphore=true

[ffm_force_mem_dep_check]
    # Check for s_wait_*cnt intstructions. Not fully implemented
    dona.component.shader_complex.force_mem_dep_check=true

[ffm_validate_gprs]
    # if set, sgprs, vpgrs and mregs are initialized to a known value. And error message is printed to itrace when trying
    # to read from an uninitialized gpr
    dona.component.shader_complex.validate_gprs=true

[ffm_validate_gprs_strict]
    # if set, sgprs, vpgrs and mregs are initialized to a known value and an assert is triggered when trying to read from an
    # uninitialized gpr
    dona.component.shader_complex.validate_gprs_strict=true

[ffm_barrier_checks_strict]
    # if set, will assert on doing doing legal but probably invalid - e.g. leaving a barrier that already has signals
    dona.component.shader_complex.barrier_checks_strict=true

[ffm_raw_shader_dump_path]
    # Dumps a raw binary of each wave's shader (from PC to S_ENDPGM) into the specified folder.
    # The full directory tree for the configured path is created automatically if it does not already exist.
    # Output files are named: shader_dump_wave_0x<dbg_id>.bin
    # Disassemble with sp3 or any compatible tool.
    dona.component.shader_complex.raw_shader_dump_path="shader_dumps"

[ffm_lds_oob_strict]
    # if set, will assert if any LDS instruction attempts to read OOB
    dona.component.shader_complex.lds_oob_strict_level=2

[ffm_lds_oob_semi_strict]
    # if set, will assert if any LDS instruction attempts to read OOB
    # but allows reads of address INT32_MAX (used by SW teams in some cases)
    dona.component.shader_complex.lds_oob_strict_level=1


[ffm_strict_mode]
    # Enable all strict modes
    ffm_validate_gprs_strict = true
    ffm_barrier_checks_strict = true
    ffm_lds_oob_strict = true

############### General OPTIONS ###############

[ffm_enable_time_slicing]
    # Allows waves / workgroups / clusters to be run in a timesliced manor.
    # This will enabling coding patterns such as consumer / producer models
    dona.component.jitcu.enable_time_slicing=true

[ffm_use_execution_engine]
    # Use legacy cluster executor path: yes/true enables legacy executor, no/false uses events
    dona.component.shader_complex.legacy_executor=false

[ffm_gfxpipe_ps_multithreaded]
    # Enable the multithreaded PS executor in gfxpipe. When true, execute_ps submissions
    # are drained by a worker pool (std::thread::hardware_concurrency()); when false,
    # PS waves run synchronously on the caller thread. See gfxpipe_execute_ps.cpp for
    # the thread-safety caveats around the shared frontend callbacks / memory.
    dona.component.gfxpipe.ps_multithreaded=true

[ffm_use_fast_float]
    # use fast float implementations instead of the ones in Math Engine
    # JIT-able and typically much faster but is not guaranteed to be bit accurate
    # some operations do not have a fast float implementation; these will fall back to MathEn
    dona.component.shader_complex.use_fast_float=true

[ffm_use_jit]
    # enable JIT compile
    # whether this is faster or not depends on the type of the workload
    dona.component.shader_complex.use_jit=true

# enable AVX implementation for supported ops
[ffm_use_avx]
dona.component.shader_complex.use_avx=true

# if enabled, dumps the cumulative execution time per ISA instruction
# do not use when profiling using other tools as getting the instruction name causes a significant overhead
[ffm_time_instructions]
dona.component.shader_complex.time_instructions=true

############### RAY TRACING OPTIONS ###############

[ffm_rt_ignore_prefilter]
    # Forces ray to always ignore prefilter node packets during traversal
    dona.component.shader_complex.rt_ignore_prefilter=true

[ffm_rt_disable_strided_hit_buffer]
    # Controls wether to use the strided (instead of non-strided) mode for calculating the hit buffer address
    # TODO(pbell) This should be read from STRIDED_HIT_BUFFER_DISABLE control register
    dona.component.shader_complex.rt_disable_strided_hit_buffer=true

[ffm_rt_bvh_dump_text]
    # Enables a json dump of the BVH for each unique BVH root encountered during traversal to the working directory.
    # Note that a rts instruction must cause traversal of the BVH for it be dumped
    dona.component.shader_complex.rt_bvh_dump="text"

[ffm_rt_bvh_dump_binary]
    # Enables a binary dump of the BVH for each unique BVH root encountered during traversal to the working directory.
    # Note that a rts instruction must cause traversal of the BVH for it be dumped
    dona.component.shader_complex.rt_bvh_dump="binary"

[ffm_rt_bvh_dump_all]
    # Enables both a binary and json dump of the BVH for each unique BVH root encountered during traversal to the working directory.
    # Note that a rts instruction must cause traversal of the BVH for it be dumped
    dona.component.shader_complex.rt_bvh_dump="all"

[ffm_rt_ray_dump_binary]
    # Enables a per-bvh dump of all rays which are encountered by the RTS.
    dona.component.shader_complex.rt_ray_dump="binary"

[ffm_rt_log_enable]
    # Enables RTS logging via gclog during traversal
    dona.component.shader_complex.rt_log_enabled=true
    gclog.ProcessCommand = "class:ffm.rtlog,debug-3"

############### DISPATCH OPTIONS ###############

[ffm_skip_dispatches]
    # Skip processing of all dispatch packets (kernel dispatches still complete with signals but no work is executed)
    dona.component.hsakmtmodel.skip_dispatches=true

[ffm_serial_dispatch]
    # Disable dispatch interleaving on executors.  When enabled, each dispatch
    # runs to completion before the next dispatch starts on the same executor
    # (no round-robin time-slicing between concurrent dispatches).  This
    # guarantees that per-quantum stats and memory log dumps are cleanly
    # per-dispatch, at the cost of preventing concurrent inter-kernel
    # communication (e.g. spin-wait synchronization between kernels).
    dona.component.hsakmtmodel.serial_dispatch=true
