name: CI

on:
  push:
    branches:
      - shared/gfx1250*
  pull_request:
    branches:
      - shared/gfx1250*
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gfx1250-gluon:
    name: Gluon
    runs-on: ['self-hosted', 'ffm:mi450']
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and Test Gluon
        env:
          TRITON_MI450_LLVM_DOWNLOAD_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -xeo pipefail
          RENDER_GID=$(getent group render | cut -d: -f3)
          echo "Render group ID: ${RENDER_GID}"
          docker run --rm --init \
            --name ci-gluon-${{ github.run_id }} \
            --device=/dev/kfd --device=/dev/dri --group-add video --group-add $RENDER_GID \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            --shm-size=16G --ulimit memlock=-1 --ulimit stack=67108864 \
            -v "${{ github.workspace }}:/code" \
            -e TRITON_MI450_LLVM_DOWNLOAD_GITHUB_TOKEN \
            -v /data/ci/ffm/rocdtif-7.13-am+ffmlite-mi400-r6.06:/ffm-base \
            -v /data/ci/ffm/rocdtif-7.13-am+ffmlite-mi400-r6.06:/ffm-update \
            -v /data/ci/triton-cache/json:/root/.triton/json \
            -v /data/ci/triton-cache/llvm:/root/.triton/llvm \
            -v /data/ci/triton-cache/nvidia:/root/.triton/nvidia \
            -v /data/ci/ccache:/root/.ccache \
            -w /code \
            --entrypoint bash \
            mkmhub.amd.com/sw-aiggfx1250-dev/ci/gfx1250-pytorch-env:1.4 \
            -lc "/code/.github/workflows/gluon.sh"
      - name: Cleanup
        if: always()
        run: |
          docker stop ci-gluon-${{ github.run_id }} 2>/dev/null || true
          docker rm -f ci-gluon-${{ github.run_id }} 2>/dev/null || true

  gfx1250-triton:
    name: Triton
    runs-on: ['self-hosted', 'ffm:mi450', 'torch:mi450']
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and Test Triton
        env:
          TRITON_MI450_LLVM_DOWNLOAD_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -xeo pipefail
          RENDER_GID=$(getent group render | cut -d: -f3)
          echo "Render group ID: ${RENDER_GID}"
          docker run --rm --init \
            --name ci-triton-${{ github.run_id }} \
            --device=/dev/kfd --device=/dev/dri --group-add video --group-add $RENDER_GID \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            --shm-size=16G --ulimit memlock=-1 --ulimit stack=67108864 \
            -v "${{ github.workspace }}:/code" \
            -e TRITON_MI450_LLVM_DOWNLOAD_GITHUB_TOKEN \
            -v /data/ci/ffm/rocdtif-7.13-am+ffmlite-mi400-r6.06:/ffm-base \
            -v /data/ci/ffm/rocdtif-7.13-am+ffmlite-mi400-r6.06:/ffm-update \
            -v /data/ci/triton-cache/json:/root/.triton/json \
            -v /data/ci/triton-cache/llvm:/root/.triton/llvm \
            -v /data/ci/triton-cache/nvidia:/root/.triton/nvidia \
            -v /data/ci/ccache:/root/.ccache \
            -w /code \
            --entrypoint bash \
            mkmhub.amd.com/sw-aiggfx1250-dev/ci/gfx1250-pytorch-env:1.4 \
            -lc "/code/.github/workflows/triton.sh"
      - name: Cleanup
        if: always()
        run: |
          docker stop ci-triton-${{ github.run_id }} 2>/dev/null || true
          docker rm -f ci-triton-${{ github.run_id }} 2>/dev/null || true
